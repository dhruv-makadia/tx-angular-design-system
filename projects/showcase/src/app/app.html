<tx-app-shell [drawerOpen]="drawerOpen()" (drawerClose)="drawerOpen.set(false)">
  <tx-sidebar
    slot="sidebar"
    [sections]="nav"
    [activeId]="activeId()"
    [(collapsed)]="collapsed"
    (itemSelect)="navigate($event.id)"
  >
    <div slot="brand" class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">tx / core</span>
    </div>
    <span slot="brand-compact" class="brand__mark" aria-hidden="true"></span>
  </tx-sidebar>

  <tx-header slot="header" [heading]="pageTitle()" menu="auto" (menuToggle)="drawerOpen.set(!drawerOpen())">
    <div slot="actions" class="header-actions">
      <div class="segmented" role="group" aria-label="Density">
        @for (option of densities; track option) {
          <button
            type="button"
            class="segmented__btn"
            [class.segmented__btn--active]="theme.density() === option"
            [attr.aria-pressed]="theme.density() === option"
            (click)="theme.density.set(option)"
          >
            {{ option }}
          </button>
        }
      </div>

      <button
        type="button"
        class="theme-toggle"
        role="switch"
        [attr.aria-checked]="theme.mode() === 'dark'"
        [attr.aria-label]="'Dark mode'"
        (click)="theme.toggleMode()"
      >
        <span class="theme-toggle__opt" [class.theme-toggle__opt--on]="theme.mode() === 'light'">
          <tx-icon name="sun" size="sm" />
        </span>
        <span class="theme-toggle__opt" [class.theme-toggle__opt--on]="theme.mode() === 'dark'">
          <tx-icon name="moon" size="sm" />
        </span>
      </button>
    </div>
  </tx-header>

  <div [class]="'density-scope tx-density-' + theme.density()">
    <router-outlet />
  </div>
</tx-app-shell>
