<fieldset
  class="tx-radio-group__set"
  [disabled]="isDisabled()"
  [attr.aria-invalid]="invalid() || null"
  [attr.aria-describedby]="hint() || error() ? id + '-desc' : null"
>
  @if (label()) {
    <legend class="tx-radio-group__legend">
      {{ label() }}
      @if (required()) {
        <span class="tx-radio-group__required" aria-hidden="true">*</span>
      }
    </legend>
  }

  <div class="tx-radio-group__options" [class.tx-radio-group__options--inline]="inline()">
    @for (option of options(); track option.value) {
      <label class="tx-radio-group__row">
        <span class="tx-radio-group__control">
          <input
            class="tx-radio-group__native"
            type="radio"
            [name]="id"
            [checked]="isChecked(option)"
            [disabled]="!!option.disabled || isDisabled()"
            (change)="select(option)"
          />
          <span class="tx-radio-group__dot" aria-hidden="true"></span>
        </span>
        <span class="tx-radio-group__text">
          <span>{{ option.label }}</span>
          @if (option.hint) {
            <span class="tx-radio-group__hint">{{ option.hint }}</span>
          }
        </span>
      </label>
    }
  </div>
</fieldset>

@if (hint() || error()) {
  <p class="tx-radio-group__desc" [class.tx-radio-group__desc--error]="invalid() && error()" [id]="id + '-desc'">
    {{ invalid() && error() ? error() : hint() }}
  </p>
}
