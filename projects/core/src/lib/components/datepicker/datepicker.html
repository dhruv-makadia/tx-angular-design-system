@if (label()) {
  <label class="tx-field__label" [attr.for]="id + '-field'">
    {{ label() }}
    @if (required()) {
      <span class="tx-field__required" aria-hidden="true">*</span>
    }
  </label>
}

<div class="tx-field__control" cdkOverlayOrigin #origin="cdkOverlayOrigin">
  <input
    #field
    type="text"
    class="tx-datepicker__field"
    [id]="id + '-field'"
    inputmode="numeric"
    autocomplete="off"
    spellcheck="false"
    [value]="text()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    [readOnly]="readonly()"
    [attr.required]="required() || null"
    [attr.aria-label]="label() ? null : ariaLabel() || null"
    [attr.aria-invalid]="showsInvalid() || null"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="expanded() ? id + '-panel' : null"
    aria-haspopup="dialog"
    (input)="onInput($event)"
    (keydown)="onFieldKeydown($event)"
    (blur)="onBlur()"
  />

  @if (showClear()) {
    <button
      type="button"
      class="tx-datepicker__clear"
      [attr.aria-label]="clearLabel"
      (click)="clear($event)"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none" />
      </svg>
    </button>
  }

  <!--
    A separate button rather than a click handler on the field: typing and
    opening the calendar are two different intents, and someone editing the text
    should not have the panel jump open under the caret.
  -->
  <button
    type="button"
    class="tx-datepicker__trigger"
    [attr.aria-label]="openLabel"
    [attr.aria-expanded]="expanded()"
    aria-haspopup="dialog"
    [disabled]="isDisabled() || readonly()"
    tabindex="-1"
    (click)="toggle()"
  >
    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <path d="M2.5 4.5h11v9h-11zM5 2.5v3M11 2.5v3M2.5 7.5h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </svg>
  </button>
</div>

@if (message()) {
  <p
    class="tx-field__desc"
    [class.tx-field__desc--error]="showsInvalid()"
    [id]="id + '-desc'"
    [attr.role]="badInput() ? 'alert' : null"
  >
    {{ message() }}
  </p>
}

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="expanded()"
  [cdkConnectedOverlayViewportMargin]="8"
  [cdkConnectedOverlayOffsetY]="4"
  (overlayOutsideClick)="onOutsideClick($event)"
  (detach)="close(false)"
>
  <div
    class="tx-datepicker__panel"
    role="dialog"
    aria-modal="false"
    [id]="id + '-panel'"
    [attr.aria-label]="label() || ariaLabel() || openLabel"
    (keydown)="onPanelKeydown($event)"
  >
    <tx-calendar
      [value]="value()"
      [min]="min()"
      [max]="max()"
      [dateDisabled]="dateDisabled()"
      [firstDayOfWeek]="firstDayOfWeek()"
      [locale]="locale()"
      [today]="today()"
      [label]="label() || openLabel"
      (dateSelect)="onCalendarSelect($event)"
    />
  </div>
</ng-template>
